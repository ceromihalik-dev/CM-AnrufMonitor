name: Windows build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test and build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qa-output | Out-Null
          ./Build.ps1 -Runtime win-x64 2>&1 | Tee-Object -FilePath qa-output/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Start WPF application and verify Windows credential protection
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/win-x64/CM-AnrufMonitor.exe'
          $qa = Join-Path $PWD 'qa-output'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', '--smoke-output', $qa) -RedirectStandardOutput (Join-Path $qa 'smoke-stdout.log') -RedirectStandardError (Join-Path $qa 'smoke-stderr.log') -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill($true)
            throw 'Windows smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed: $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $qa 'smoke-result.json'))) { throw 'Windows smoke test produced no result.' }
          Get-Content (Join-Path $qa 'smoke-result.json')
      - name: Package executable and documentation
        shell: pwsh
        run: ./tools/Package-Windows.ps1 -Runtime win-x64
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve installation package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CM-AnrufMonitor-Windows-x64
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Publish first release for this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $tag = "v$version"
          $existing = & gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($existing -contains $tag) {
            Write-Host "Release $tag already exists; leaving it unchanged. This build is available as an artifact."
            exit 0
          }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          $assets += @(Get-ChildItem qa-output -Filter '*.png' -File | ForEach-Object FullName)
          $assets += @((Join-Path $PWD 'qa-output/smoke-result.json'))
          & gh release create $tag @assets --target $env:GITHUB_SHA --title "CM AnrufMonitor $version" --notes-file RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
